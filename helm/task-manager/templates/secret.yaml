{{- if not .Values.mongodb.existingSecret }}
{{- if not .Values.mongodb.uri }}
{{- fail "mongodb.uri is required unless mongodb.existingSecret is set — pass it with --set mongodb.uri=..." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "task-manager.fullname" . }}-mongodb
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
type: Opaque
data:
  mongo-uri: {{ .Values.mongodb.uri | b64enc | quote }}
{{- end }}
