name: Claude Code Review

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  claude:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      contains(github.event.comment.body, '@claude')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr review:*)"
          prompt: |
            Review pull request #${{ github.event.issue.number || github.event.pull_request.number }}
            in ${{ github.repository }} for bugs, security issues, and style problems.
            Be concise.

            Read the diff with `gh pr diff`. Post your review by running
            `gh pr comment <number> --body "..."`. If nothing needs changing, say so
            in a short comment and run `gh pr review <number> --approve`.
            You must post a comment before finishing, even if the review is clean.
